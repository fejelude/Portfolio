name: Homepage commissions directory CI
on:
  pull_request:
    paths:
      - index.html
      - css/services-directory.css
      - js/services-directory.mjs
      - tests/services-directory.test.mjs
      - verification/services-directory-smoke.cjs
      - .github/workflows/services-directory-ci.yml
permissions:
  contents: read
jobs:
  directory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check js/services-directory.mjs && node --test tests/services-directory.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node verification/services-directory-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: services-directory-browser-previews
          path: verification/services-directory-results/
