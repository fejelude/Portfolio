name: Compendium browser checks
on:
  pull_request:
    paths:
      - 'compendium.html'
      - 'css/compendium.css'
      - 'js/compendium*.mjs'
      - 'assets/compendium/**'
      - 'tests/compendium*.test.mjs'
      - 'verification/compendium-smoke.cjs'
      - 'verification/birthday-server.cjs'
      - '.github/workflows/compendium-ci.yml'
permissions:
  contents: read
jobs:
  gallery:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browsers: chromium firefox
            engines: chromium,firefox
          - os: macos-15
            browsers: webkit
            engines: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/compendium*.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
      - run: node verification/compendium-smoke.cjs
        env:
          COMPENDIUM_ENGINES: ${{ matrix.engines }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compendium-${{ runner.os }}
          path: verification/compendium-results/
