name: Sofra Panel CI

on:
  pull_request:
    paths:
      - 'SofraPanel.html'
      - 'Sofra.html'
      - 'sofra-product.*'
      - 'tests/**'
      - 'verification/sofra-smoke.cjs'
      - 'sofra-panel*.js'
      - 'sofra-panel*.css'
      - 'api/sofra/**'
      - '.github/workflows/sofra-panel-ci.yml'
  push:
    branches: [main]
    paths:
      - 'SofraPanel.html'
      - 'Sofra.html'
      - 'sofra-product.*'
      - 'tests/**'
      - 'verification/sofra-smoke.cjs'
      - 'sofra-panel*.js'
      - 'sofra-panel*.css'
      - 'api/sofra/**'
      - '.github/workflows/sofra-panel-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check sofra-panel.js
          node --check sofra-panel-core.js
          node --check api/sofra/_config.js
          node --check api/sofra/_discord-permissions.js
          node --check api/sofra/_guild-validation.js
          node --check api/sofra/guild.js
          node --check sofra-product.js
          node --check api/sofra/_runtime.js
      - name: Regression tests
        run: node --test api/sofra/*.test.js tests/*.test.js tests/*.test.mjs
      - name: Browser smoke test with fixture data
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node verification/sofra-smoke.cjs
