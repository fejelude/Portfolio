name: Homepage world CI
on:
  pull_request:
    paths:
      - index.html
      - Gallery.html
      - scripts/sync-site-updated.cjs
      - interactives.html
      - css/interactives.css
      - js/interactives-entry.mjs
      - tests/interactives.test.cjs
      - css/roblox-creations.css
      - js/roblox-creations.mjs
      - assets/roblox-creations/**
      - tests/roblox-creations.test.cjs
      - verification/roblox-creations-smoke.cjs
      - css/home-world.css
      - js/hero-terminal.mjs
      - tests/hero-terminal.test.mjs
      - css/hero-pixels.css
      - js/hero-pixels.mjs
      - verification/hero-pixels-smoke.cjs
      - css/sofra-feature.css
      - css/sofra-sakura-vfx.css
      - js/sofra-sakura-vfx.mjs
      - tests/sofra-sakura-vfx.test.mjs
      - verification/sofra-sakura-vfx-smoke.cjs
      - css/feje-tourbillon.css
      - css/feje-tourbillon-scroll-vfx.css
      - js/feje-tourbillon*.mjs
      - js/vendor/three-*
      - verification/tourbillon-live-smoke.cjs
      - verification/daedalus-scroll-vfx-smoke.cjs
      - verification/daedalus-astral-review.cjs
      - verification/daedalus-transmission-smoke.cjs
      - assets/tourbillon/**
      - tests/feje-tourbillon.test.mjs
      - tests/feje-tourbillon-scroll-vfx.test.mjs
      - js/sofra-feature.mjs
      - verification/sofra-feature-smoke.cjs
      - js/home-world*.mjs
      - js/home-collectibles.mjs
      - assets/home-world/**
      - tests/home-world.test.mjs
      - verification/home-world-smoke.cjs
      - verification/automotive-fidelity.cjs
      - .github/workflows/home-world-ci.yml
permissions:
  contents: read
jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify synchronized website update dates
        run: node scripts/sync-site-updated.cjs --check
      - run: node --check js/hero-pixels.mjs && node --check js/sofra-feature.mjs && node --check js/home-collectibles.mjs && node --check js/home-world.mjs && node --check js/home-world-renderer.mjs && node --test tests/home-world.test.mjs
      - run: node --check js/interactives-entry.mjs && node --test tests/interactives.test.cjs
      - run: node --check js/feje-tourbillon.mjs && node --check js/feje-tourbillon-renderer.mjs && node --test tests/feje-tourbillon.test.mjs
      - run: node --check js/feje-tourbillon-scroll-vfx.mjs && node --test tests/feje-tourbillon-scroll-vfx.test.mjs
      - run: node --check js/hero-terminal.mjs && node --test tests/hero-terminal.test.mjs
      - run: node --check js/roblox-creations.mjs && node --test tests/roblox-creations.test.cjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install chromium
      - run: npx playwright install --with-deps firefox webkit
      - run: node verification/tourbillon-live-smoke.cjs --preview-loading
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daedalus-preview-loading-browser-previews
          path: verification/home-world-results/daedalus-cold-*.png
      - run: node verification/daedalus-scroll-vfx-smoke.cjs --cross-engine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daedalus-scroll-vfx-browser-previews
          path: verification/daedalus-scroll-vfx-results/
      - run: node verification/tourbillon-live-smoke.cjs --cross-engine
      - run: node verification/roblox-creations-smoke.cjs
      - run: node verification/hero-pixels-smoke.cjs
      - run: node verification/sofra-feature-smoke.cjs
      - run: node verification/home-world-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-world-browser-previews
          path: verification/home-world-results/

  tourbillon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install chromium
      - run: node verification/tourbillon-live-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tourbillon-browser-previews
          path: verification/home-world-results/

  daedalus-transmission:
    if: github.head_ref == 'feat/daedalus-timekeeping-transmission'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install chromium
      - name: Verify the Daedalus timing train and capture inspection views
        run: node verification/daedalus-transmission-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daedalus-transmission-inspection
          path: verification/daedalus-transmission-results/

  fidelity:
    if: startsWith(github.head_ref, 'feat/automotive-ultra-fidelity')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install chromium
      - name: Capture matched baseline and new car renders
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/portfolio-baseline" "$BASE_REVISION"
          node verification/automotive-fidelity.cjs "$RUNNER_TEMP/portfolio-baseline"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automotive-fidelity-comparison
          path: verification/automotive-fidelity-results/

  astral-review:
    if: github.head_ref == 'feat/daedalus-astral-grande-complication' || github.head_ref == 'feat/daedalus-haute-joaillerie'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install chromium
      - name: Compare Daedalus renders and measure readback
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/daedalus-base" "$BASE_REVISION"
          node verification/daedalus-astral-review.cjs "$RUNNER_TEMP/daedalus-base"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daedalus-astral-comparison
          path: verification/daedalus-astral-results/

  sofra-sakura:
    if: github.head_ref == 'feat/sofra-sakura-ambient-vfx'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check js/sofra-sakura-vfx.mjs && node --test tests/sofra-sakura-vfx.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node verification/sofra-sakura-vfx-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sofra-sakura-desktop-mobile
          path: verification/sofra-sakura-results/

  daedalus-preview-media:
    if: github.head_ref == 'feat/daedalus-celestial-preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require supplied cinematic media before merge
        run: test -s assets/tourbillon/daedalus-preview.mp4
