name: Homepage world CI
on:
  pull_request:
    paths:
      - index.html
      - css/home-world.css
      - js/home-world*.mjs
      - assets/home-world/**
      - tests/home-world.test.mjs
      - verification/home-world-smoke.cjs
      - .github/workflows/home-world-ci.yml
permissions:
  contents: read
jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check js/home-world.mjs && node --check js/home-world-renderer.mjs && node --test tests/home-world.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node verification/home-world-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-world-browser-previews
          path: verification/home-world-results/
