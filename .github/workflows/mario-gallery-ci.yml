name: Mario Odyssey gallery CI
on:
  pull_request:
    paths:
      - Gallery.html
      - assets/mario-odyssey-memories/**
      - scripts/import-mario-memories.py
      - tests/mario-gallery.test.mjs
      - verification/mario-gallery-smoke.cjs
      - .github/workflows/mario-gallery-ci.yml
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/mario-gallery.test.mjs
      - run: python -m py_compile scripts/import-mario-memories.py
      - run: npm install --no-save --package-lock=false playwright@1.62.1 gsap@3.12.2 three@0.128.0
      - run: npx playwright install --with-deps chromium webkit
      - run: node verification/mario-gallery-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mario-gallery-desktop-mobile
          path: verification/mario-gallery-results/
