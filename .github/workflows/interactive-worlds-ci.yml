name: Interactive Worlds CI
on:
  pull_request:
    paths:
      - 'interactives.html'
      - 'interactives/**'
      - 'css/interactive-worlds.css'
      - 'js/interactive-worlds/**'
      - 'tests/interactive-worlds.test.mjs'
      - 'verification/interactive-worlds-smoke.cjs'
      - '.github/workflows/interactive-worlds-ci.yml'
permissions:
  contents: read
jobs:
  worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/interactive-worlds.test.mjs tests/interactives.test.cjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node verification/interactive-worlds-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interactive-worlds-browser-previews
          path: verification/interactive-worlds-results/
